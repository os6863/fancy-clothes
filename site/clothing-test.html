<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clothing Rack — Safe Motion Test</title><style>*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#123d2d;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}.top{padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.top b{font-size:18px}.top small{color:#68736c}.note{text-align:center;padding:5px 20px;color:#68736c;font-size:12px}.scene{height:72vh;min-height:410px;position:relative;overflow:hidden;touch-action:pan-y}.rail{position:absolute;top:13%;left:0;width:100%;height:10px;background:#292d2a;box-shadow:0 3px 5px #0002}.rack{position:absolute;top:calc(13% + 8px);left:50%;height:74%;display:flex;align-items:flex-start;gap:0;transform:translateX(-50%);transition:transform .55s cubic-bezier(.2,.8,.2,1);will-change:transform;direction:ltr}.item{width:170px;flex:none;position:relative;height:100%;display:flex;align-items:center;flex-direction:column;cursor:pointer;transition:transform .5s,filter .5s;transform-origin:top center;filter:brightness(.9)}.item.active{transform:scale(1.14);z-index:3;filter:brightness(1)}.hook{height:35px;width:32px;border:5px solid #292d2a;border-bottom:0;border-radius:55% 55% 0 0;transform:translateY(-15px) rotate(10deg)}.hanger{width:140px;height:55px;position:absolute;top:22px;z-index:1}.cloth{position:absolute;top:55px;width:162px;height:265px;filter:drop-shadow(4px 8px 8px #0002)}.controls{display:flex;justify-content:center;align-items:center;gap:20px;padding:8px}.controls button{background:#123d2d;border:0;color:white;border-radius:30px;padding:13px 19px;font-size:16px}.name{min-width:130px;text-align:center;font-weight:600}.foot{text-align:center;color:#68736c;font-size:12px;padding:12px}.tag{background:#f3f2ee;padding:5px 9px;border-radius:8px;font-size:11px}</style></head><body><header class="top"><b>YALDA LOOK <span class="tag">MOTION TEST</span></b><small>نسخه آزمایشی مستقل</small></header><p class="note">روی لباس‌ها بزن یا با انگشت به چپ و راست بکش</p><main class="scene" id="scene"><div class="rail"></div><div class="rack" id="rack"></div></main><div class="controls"><button id="prev" aria-label="قبلی">→</button><div class="name" id="name"></div><button id="next" aria-label="بعدی">←</button></div><p class="foot">این یک نمونه مستقل برای آزمودن حرکت است؛ انیمیشن اصلی Fancy Clothes تغییر نکرده است.</p><script>
const data=[['پیراهن آبی','#7096bd','dress'],['شومیز کرم','#e4d3b9','shirt'],['کت جین','#577fa2','jacket'],['پیراهن صورتی','#db98ac','dress'],['بلوز سبز','#829c85','shirt'],['مانتو مشکی','#3d4244','jacket']];
const rack=document.querySelector('#rack'),name=document.querySelector('#name');
function garment(color,type){let path=type==='dress'?'M57 12 L85 12 L101 36 L135 51 L120 92 L103 84 L122 237 Q81 251 22 237 L42 84 L25 92 L10 51 L44 36 Z':type==='jacket'?'M52 12 L91 12 L123 34 L145 104 L116 117 L102 77 L106 242 L38 242 L42 77 L28 117 L0 104 L21 34 Z':'M51 12 L92 12 L122 37 L145 89 L119 103 L101 75 L108 219 Q70 232 35 219 L42 75 L24 103 L0 89 L22 37 Z';return '<svg class="cloth" viewBox="0 0 145 260" xmlns="http://www.w3.org/2000/svg"><path d="'+path+'" fill="'+color+'" stroke="#48524d" stroke-width="1.4"/><path d="M51 12 Q71 43 92 12" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/><path d="M70 44 L70 205" stroke="#fff" stroke-opacity=".25" stroke-width="2"/></svg>'}
rack.innerHTML=data.map(([n,c,t],i)=>'<div class="item" data-i="'+i+'" aria-label="'+n+'"><div class="hook"></div><svg class="hanger" viewBox="0 0 140 55"><path d="M69 0 Q58 13 70 19 L131 51 L9 51 L70 19" fill="none" stroke="#775a43" stroke-width="6" stroke-linejoin="round"/></svg>'+garment(c,t)+'</div>').join('');
let current=0;function select(i){current=(i+data.length)%data.length;document.querySelectorAll('.item').forEach((el,j)=>el.classList.toggle('active',j===current));const item=rack.children[current],offset=item.offsetLeft+item.offsetWidth/2;rack.style.transform='translateX(calc(-1 * '+offset+'px))';rack.style.left='50%';name.textContent=data[current][0]}
rack.addEventListener('click',e=>{let x=e.target.closest('.item');if(x)select(+x.dataset.i)});document.querySelector('#prev').onclick=()=>select(current-1);document.querySelector('#next').onclick=()=>select(current+1);let start=null;document.querySelector('#scene').addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});document.querySelector('#scene').addEventListener('touchend',e=>{if(start===null)return;let d=e.changedTouches[0].clientX-start;if(Math.abs(d)>35)select(current+(d<0?1:-1));start=null},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')select(current+1);if(e.key==='ArrowRight')select(current-1)});select(0);
</script></body></html>
